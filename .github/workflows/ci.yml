name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.optimize }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        optimize:
          - Debug
          - ReleaseSafe
          - ReleaseFast
          - ReleaseSmall

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install development toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: "2026.8.10"

      - name: Run test suite
        run: zig build test -Doptimize=${{ matrix.optimize }}

  portability:
    name: Test (${{ matrix.os }}, Debug)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - windows-2025

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install development toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: "2026.8.10"

      - name: Run test suite
        run: zig build test -Doptimize=Debug

  quality:
    name: Package and integration checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install development toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: "2026.8.10"

      - name: Check formatting
        run: |
          mise fmt --check
          zig fmt --check build.zig src tests bench examples

      - name: Build API documentation
        run: zig build docs

      - name: Compile benchmarks
        run: zig build bench -Doptimize=ReleaseFast

      - name: Verify filtered package and external consumer
        shell: bash
        run: |
          zig fetch . --debug-hash
          package_hash="$(zig fetch .)"
          package_archive="${HOME}/.cache/zig/p/${package_hash}.tar.gz"
          test -f "${package_archive}"

          package_dir="$(mktemp -d)"
          tar -xzf "${package_archive}" -C "${package_dir}" --strip-components=1
          cd "${package_dir}"
          zig build test --cache-dir "${GITHUB_WORKSPACE}/.zig-cache/packaged-tests"
          cd tests/consumer
          zig build test --cache-dir "${GITHUB_WORKSPACE}/.zig-cache/packaged-consumer"
