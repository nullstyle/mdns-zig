name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# mdns-zig parses untrusted UDP bytes, so build.zig refuses ReleaseFast and
# ReleaseSmall. Every lane therefore runs Debug or ReleaseSafe only.
jobs:
  test:
    name: Test (${{ matrix.optimize }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        optimize:
          - Debug
          - ReleaseSafe

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install development toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: "2026.8.10"

      # mise.toml points ZIG_GLOBAL_CACHE_DIR at .zig-global-cache inside the
      # checkout (quic-zig test.yml pattern), so that is the path to cache.
      - name: Cache Zig packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .zig-global-cache
          key: zig-global-${{ runner.os }}-${{ hashFiles('build.zig.zon', 'mise.toml') }}
          restore-keys: zig-global-${{ runner.os }}-

      - name: Run test suite
        run: zig build test -Doptimize=${{ matrix.optimize }}

  portability:
    name: Test (${{ matrix.os }}, Debug)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install development toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: "2026.8.10"

      - name: Cache Zig packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .zig-global-cache
          key: zig-global-${{ runner.os }}-${{ hashFiles('build.zig.zon', 'mise.toml') }}
          restore-keys: zig-global-${{ runner.os }}-

      # Hermetic tests only (plan section 8). The suite binds *:5353 (a
      # refused bind skips), and MDNS_HERMETIC=1 also skips the loopback
      # multicast tests in tests/loop_test.zig, which need Local Network
      # permission on macOS 15+ that a CI runner may not grant; without
      # it a runner that binds but does not deliver the multicast would
      # fail them instead of skipping.
      - name: Run test suite
        run: zig build test -Doptimize=Debug
        env:
          MDNS_HERMETIC: "1"

  quality:
    name: Package and integration checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install development toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: "2026.8.10"

      - name: Cache Zig packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .zig-global-cache
          key: zig-global-${{ runner.os }}-${{ hashFiles('build.zig.zon', 'mise.toml') }}
          restore-keys: zig-global-${{ runner.os }}-

      - name: Check formatting
        run: |
          mise fmt --check
          zig fmt --check build.zig src tests spikes examples

      - name: Release hygiene
        run: sh tools/release-check.sh "$GITHUB_REF"

      - name: Build API documentation
        run: zig build docs

      # `.paths` excludes tests/, spikes/ and interop/, and build.zig returns
      # early for dependency builds, so `zig build test` at the package root
      # would configure nothing. Instead: extract the package, copy the
      # out-of-tree consumer into it, and run its tests. The consumer's
      # `.path = "../.."` then resolves to the extracted package.
      #
      # `zig fetch .` copies the whole directory before applying `.paths`.
      # With ZIG_GLOBAL_CACHE_DIR inside the checkout that copy recurses
      # into its own destination until NameTooLong, so fetch from a clean
      # `git archive` export instead of from `.`.
      - name: Verify filtered package and external consumer
        shell: bash
        run: |
          set -euo pipefail
          src_dir="$(mktemp -d)"
          git archive --format=tar HEAD | tar -x -C "${src_dir}"

          zig fetch "${src_dir}" --debug-hash
          pkg="$(zig fetch "${src_dir}")"
          package_archive="${ZIG_GLOBAL_CACHE_DIR:-$HOME/.cache/zig}/p/${pkg}.tar.gz"
          test -f "${package_archive}"

          package_dir="$(mktemp -d)"
          tar -xzf "${package_archive}" -C "${package_dir}" --strip-components=1
          test ! -e "${package_dir}/tests"
          test ! -e "${package_dir}/spikes"
          test ! -e "${package_dir}/interop"
          test -f "${package_dir}/examples/browse.zig"

          mkdir -p "${package_dir}/tests"
          cp -R tests/consumer "${package_dir}/tests/consumer"
          cd "${package_dir}/tests/consumer"
          zig build test --cache-dir "${GITHUB_WORKSPACE}/.zig-cache/packaged-consumer"
          zig build test --cache-dir "${GITHUB_WORKSPACE}/.zig-cache/packaged-consumer" -Doptimize=ReleaseSafe

  # Advisory: real sockets on the shared 5353 port next to avahi-daemon
  # (tests/live/main.zig -> mdns-live: bind, join, browse, advertise for
  # a few seconds in mode B, print RESULT). The runner is never the first
  # binder with avahi up, so this also covers the shared-port path.
  live:
    name: Live sockets (ubuntu, avahi, advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install development toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: "2026.8.10"

      - name: Cache Zig packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .zig-global-cache
          key: zig-global-${{ runner.os }}-${{ hashFiles('build.zig.zon', 'mise.toml') }}
          restore-keys: zig-global-${{ runner.os }}-

      - name: Install and start avahi-daemon
        run: |
          sudo apt-get update
          sudo apt-get install -y avahi-daemon avahi-utils
          sudo systemctl start avahi-daemon || sudo avahi-daemon -D
          sleep 2
          systemctl status avahi-daemon --no-pager || true

      - name: Run live-socket tests
        run: zig build live -- --seconds 3

  # Advisory: coverage-guided fuzzing over the codec and Engine.handle
  # (plan section 8, tier 3: six std.testing.fuzz targets). A filtered
  # test binary under --fuzz aborts the build runner (ziglang/zig#25352),
  # so this runs the unfiltered suite. `-Duse-llvm=true` is required on
  # this x86_64 runner: the self-hosted backend emits no sancov coverage
  # and the fuzzer dies with "pcs_len was zero" (build.zig). Budget:
  # `--fuzz=N` is N runs per target with no time flag; M1 measured 2M at
  # about 58 s for the four codec targets on an M-series Mac (CHANGELOG),
  # so 1M is the ~60 s calibration for the slower hosted runner, and
  # `timeout-minutes` bounds it. Recalibrate when targets are added.
  fuzz:
    name: Fuzz (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install development toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: "2026.8.10"

      - name: Cache Zig packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .zig-global-cache
          key: zig-global-${{ runner.os }}-${{ hashFiles('build.zig.zon', 'mise.toml') }}
          restore-keys: zig-global-${{ runner.os }}-

      - name: Fuzz
        run: zig build test -Duse-llvm=true --fuzz=1M
